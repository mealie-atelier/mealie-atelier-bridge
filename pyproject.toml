[project]
name = "mealie-atelier-bridge"
version = "0.12.0"
description = "Optional Home Assistant integration for Mealie Atelier: secure API bridge and kitchen workflows."
readme = "README.md"
license = "MIT"
# Home Assistant 2026.10 requires Python 3.14.2 or newer.
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-homeassistant-custom-component==0.13.375",
    "ruff==0.14.0",
]

[tool.uv]
package = false
# Dev-only: Home Assistant pins an older Pillow with published advisories. The integration
# does not ship or import Pillow; the tests do not depend on the pinned version.
override-dependencies = ["pillow>=13.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
