[project]
name = "mealie-atelier-bridge"
version = "0.9.5"
description = "Optional Home Assistant integration for Mealie Atelier: secure API bridge and kitchen workflows."
readme = "README.md"
license = "MIT"
# Home Assistant 2026.10 requires Python 3.14.2 or newer.
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-homeassistant-custom-component==0.13.375",
    "ruff==0.14.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Temporary: the current tests stub the homeassistant package. Remove once they run on the real
# pytest-homeassistant-custom-component fixtures.
addopts = "-p no:homeassistant"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint.per-file-ignores]
# These tests load the integration modules from their file paths before importing them,
# so module-level imports necessarily follow that bootstrap block.
"tests/test_api.py" = ["E402"]
"tests/test_nutrition.py" = ["E402"]
"tests/test_websocket_contract.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
