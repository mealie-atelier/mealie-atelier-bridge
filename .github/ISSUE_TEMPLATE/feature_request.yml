name: Feature request
description: Suggest a useful improvement to the kitchen workflow
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the cooking or setup problem first. Mealie Atelier should remain useful without Home Assistant; note whether your idea depends on HA or Mealie-specific capabilities.
  - type: textarea
    id: problem
    attributes:
      label: What is difficult today?
      description: Describe the kitchen task and who is affected.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would improve it?
      description: Explain the desired result, not only a particular implementation.
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Where should it work?
      multiple: true
      options:
        - Standalone Web (no Home Assistant)
        - Home Assistant with Mealie Atelier Bridge
        - Home Assistant Core Mealie provider
        - Not sure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or additional context
      description: Include accessibility, responsive, privacy, or reduced-motion needs when relevant.
